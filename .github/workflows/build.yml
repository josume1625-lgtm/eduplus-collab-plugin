name: Build IntelliJ Plugin (Free Cloud CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持网页端手动一键触发编译

jobs:
  build:
    name: Build & Package EduPlus Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Embed 100% Offline Monaco Assets
        run: |
          mkdir -p src/main/resources/webapp/vs
          curl -sL https://registry.npmmirror.com/monaco-editor/-/monaco-editor-0.45.0.tgz | tar -xz -C src/main/resources/webapp/vs --strip-components=3 package/min/vs
          ls -la src/main/resources/webapp/vs/

      - name: Build Plugin Distribution (.zip)
        run: gradle buildPlugin --no-daemon --stacktrace

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduPlus-Collab-Plugin-Distribution
          path: build/distributions/*.zip
          retention-days: 14
